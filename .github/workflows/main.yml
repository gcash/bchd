name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.14.0
        env:
          GO111MODULE: on
      - name: Run goclean.sh
        run: ./goclean.sh
        env:
          GO111MODULE: on
      - name: Go Build/Install
        run: go build && go install . ./cmd/...
        env:
          GO111MODULE: on
  test-race:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test with the race detector
        run: go test -race -timeout 100m ./...
        env:
          GO111MODULE: on
  test-386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test the consensus packages on 32-bit
        run: go test ./txscript/... ./blockchain/... ./wire/... ./mempool/...
        env:
          GO111MODULE: on
          GOARCH: "386"
